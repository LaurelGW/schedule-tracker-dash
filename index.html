}

  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1722; --surface:#172231; --surface-2:#1d2a3c; --fg:#e5ebf3; --muted:#94a3b8; --line:#2a3a50;
  --navy:#132a4a; --navy-2:#1e3a66; --on-navy:#ffffff;
  --avail-text:#fb923c; --away-text:#c4b5fd;
  --h-full:#14532d; --h-low:#4d3f0b; --h-mid:#7c5a0a; --h-high:#d97706; --h-away:#33295a; --h-none:#4c1d1d;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
header.top{background:linear-gradient(90deg,var(--navy),var(--navy-2));color:var(--on-navy);padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:11.5px;opacity:.8}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.14);border-radius:7px;padding:6px 12px;text-align:center;min-width:72px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;opacity:.85}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 16px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--navy-2);border-color:var(--navy-2);font-weight:600}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:var(--fg)}}
main{padding:16px;max-width:1600px;margin:0 auto}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn,.sel,.search{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 10px;height:32px}
.btn{cursor:pointer;font-weight:600}
.btn.cur{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn small{font-weight:500;opacity:.75;margin-left:6px}
.sel{cursor:pointer;padding-right:6px}
.sel.on{border-color:var(--navy-2);box-shadow:0 0 0 1px var(--navy-2)}
.search{min-width:0;width:220px;max-width:100%}
.ctl-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-left:4px}
.btn:focus-visible,.sel:focus-visible,.search:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--avail);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--fg);margin:4px 0 14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.card{background:var(--surface);border-radius:10px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.card-h{background:linear-gradient(90deg,var(--navy),var(--navy-2));color:var(--on-navy);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.card-h h2{margin:0;font-size:14.5px}
.card-h span{font-size:11.5px;opacity:.85}
.scroll{overflow-x:auto}
.wk{display:grid;grid-template-columns:78px repeat(5,minmax(180px,1fr));border-top:1px solid var(--line);min-width:980px}
.wk:first-child{border-top:0}
.wk .lbl{padding:10px 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;background:var(--surface-2)}
.day{padding:8px 6px;border-left:1px solid var(--line);min-width:0}
.dname{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.slots{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.s{height:17px;border-radius:3px;font-size:8.5px;font-weight:700;color:#fff;display:grid;place-items:center}
.s.filled{background:var(--filled)} .s.available{background:var(--avail)} .s.pto,.s.traveling{background:var(--away)} .s.noScheduleNoSlot,.s.blank{background:var(--none)}
.loc{font-size:11px;margin-top:5px;color:var(--fg);overflow-wrap:anywhere}
.loc .pm{color:var(--away-text)}
.open{font-size:11px;font-weight:700;color:var(--avail-text);margin-top:2px}
.tag{font-size:10.5px;color:var(--away-text);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:7px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mini{display:inline-flex;gap:2px}
.mini i{width:9px;height:9px;border-radius:2px}
.mini i.filled{background:var(--filled)} .mini i.available{background:var(--avail)} .mini i.pto,.mini i.traveling{background:var(--away)} .mini i.noScheduleNoSlot,.mini i.blank{background:var(--none)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pill.o{background:var(--h-mid);color:var(--h-low-fg)} .pill.f{background:var(--h-full);color:var(--h-full-fg)} .pill.a{background:var(--h-away);color:var(--h-away-fg)} .pill.n{background:var(--h-none);color:var(--h-none-fg)}
.num-o{color:var(--avail-text);font-weight:700}
.hm{border-collapse:separate;border-spacing:3px;min-width:0;width:auto;font-size:11.5px}
.hm th{background:none;border:0;padding:2px 4px;text-align:center;font-size:9.5px;line-height:1.2}
.hm th.wkh{font-size:10.5px;color:var(--fg);border-bottom:2px solid var(--line)}
.hm th.pn{text-align:left}
.hm td{border:0;padding:0}
.hm td.pn{font-weight:600;white-space:nowrap;padding-right:10px;font-size:12px}
.hc{width:52px;height:28px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:11px}

.empty{background:var(--surface);border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

lled","filled","available","filled","filled","filled","available"]}]},{"p":"Evan Kern","w":"2026-10-12","days":[{"am":"EMG-HVILLE","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","noScheduleNoSlot","noScheduleNoSlot"]},{"am":"EMG-HVILLE","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","noScheduleNoSlot","noScheduleNoSlot"]},{"am":"TOC-ATHENS","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"EMG-ATHENS","split":false,"pm":"","s":["filled","filled","filled","filled","filled","available","available","available","filled"]},{"am":"TOC-MADISON","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]}]},{"p":"Jedd Thorderson","w":"2026-10-12","days":[{"am":"BJISG","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"BJISG","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"BJISG","split":false,"pm":"","s":["available","available","available","available","available","available","available","available","available"]},{"am":"HC-VALDOSTA","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","available","available"]},{"am":"HC-VALDOSTA","split":false,"pm":"","s":["filled","available","available","available","available","available","available","available","available"]}]},{"p":"John Lugo","w":"2026-10-12","days":[{"am":"Admin/Education","split":false,"pm":"","s":["blank","blank","blank","blank","blank","blank","blank","blank","blank"]},{"am":"BW-AUBURN","split":false,"pm":"","s":["pto","pto","pto","filled","filled","filled","filled","filled","noScheduleNoSlot"]},{"am":"HC-DOTHAN","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","noScheduleNoSlot"]},{"am":"","split":false,"pm":"","s":["pto","pto","pto","pto","pto","pto","pto","pto","pto"]},{"am":"","split":false,"pm":"","s":["pto","pto","pto","pto","pto","pto","pto","pto","pto"]}]},{"p":"Karah Loftin","w":"2026-10-12","days":[{"am":"RES-FAYETTEVILLE","split":false,"pm":"","s":["filled","available","filled","filled","filled","filled","filled","filled","filled"]},{"am":"AHS-SMYRNA","split":false,"pm":"","s":["noScheduleNoSlot","available","available","available","available","available","available","filled","available"]},{"am":"AHS-JOHNS CREEK","split":true,"pm":"AHS-LAWRENCEVILLE","s":["filled","filled","filled","filled","traveling","filled","filled","filled","filled"]},{"am":"AHS-EAST COBB","split":false,"pm":"","s":["noScheduleNoSlot","filled","filled","filled","filled","filled","available","filled","filled"]},{"am":"AHS-LAWRENCEVILLE","split":false,"pm":"","s":["available","filled","available","available","traveling","filled","filled","filled","filled"]}]},{"p":"Timothy Dau","w":"2026-10-12","days":[{"am":"EMERGE-ASHVILLE","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"EMERGE-ASHVILLE","split":false,"pm":"","s":["available","filled","filled","filled","filled","filled","available","available","available"]},{"am":"EMERGE-HICKORY","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"EMERGE-STATESVILLE","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]},{"am":"EMERGE-ARDEN","split":false,"pm":"","s":["filled","filled","filled","filled","filled","filled","filled","filled","filled"]}]}];
const SL = ['8','9','10','11a','12','1','2','3','4'];
const DN = ['Mon','Tue','Wed','Thu','Fri'];
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (dt,n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n);
const mKey = s => s.slice(0,7);
const mLabel = k => MN[+k.slice(5,7)-1] + ' ' + k.slice(0,4);
const wLabel = s => { const d = pd(s); return 'Wk of ' + MS[d.getMonth()] + ' ' + d.getDate(); };
const dLabel = (w,i) => { const d = addD(pd(w), i); return DN[i] + ' ' + (d.getMonth()+1) + '/' + d.getDate(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAway = s => s==='pto' || s==='traveling';
const isNone = s => s==='noScheduleNoSlot' || s==='blank';

const now = new Date();
const CUR = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
const months = [...new Set(DATA.map(r => mKey(r.w)))].sort();
const st = { view:'prov', month:CUR, week:'all', prov:'all', q:'' };

const $ = id => document.getElementById(id);

function setupMonths(){
  $('curBtn').innerHTML = esc(mLabel(CUR)) + '<small>Current</small>';
  const past = months.filter(m => m < CUR).reverse();
  const future = months.filter(m => m > CUR);
  let h = '<option value="">Past months…</option>';
  if (past.length) h += past.map(m => `<option value="${m}">${esc(mLabel(m))}</option>`).join('');
  else h += '<option disabled>No past months</option>';
  if (future.length) h += '<optgroup label="Upcoming">' + future.map(m => `<option value="${m}">${esc(mLabel(m))}</option>`).join('') + '</optgroup>';
  $('pastSel').innerHTML = h;
}
function monthRecs(){ return DATA.filter(r => mKey(r.w) === st.month); }
function setupWeeks(){
  const wks = [...new Set(monthRecs().map(r => r.w))].sort();
  $('weekSel').innerHTML = '<option value="all">All weeks</option>' + wks.map(w => `<option value="${w}">${wLabel(w)}</option>`).join('');
  if (!wks.includes(st.week)) st.week = 'all';
  $('weekSel').value = st.week;
  const provs = [...new Set(monthRecs().map(r => r.p))].sort();
  $('provSel').innerHTML = '<option value="all">All providers</option>' + provs.map(p => `<option>${esc(p)}</option>`).join('');
  if (!provs.includes(st.prov)) st.prov = 'all';
  $('provSel').value = st.prov;
}
function filtered(){
  const q = st.q.trim().toLowerCase();
  return monthRecs().filter(r =>
    (st.week==='all' || r.w===st.week) && (st.prov==='all' || r.p===st.prov) &&
    (!q || r.p.toLowerCase().includes(q) || r.days.some(d => (d.am+' '+d.pm).toLowerCase().includes(q))));
}
function count(recs){
  let a=0,f=0; recs.forEach(r => r.days.forEach(d => d.s.forEach(s => { if(s==='available')a++; else if(s==='filled')f++; })));
  return {a,f};
}
function header(recs){
  const all = monthRecs();
  const {a,f} = count(recs);
  $('kA').textContent = a; $('kF').textContent = f;
  $('kR').textContent = (a+f) ? Math.round(f/(a+f)*100)+'%' : '—';
  $('title').textContent = 'EMG Solutions — ' + mLabel(st.month) + ' Schedule Availability';
  const wks = [...new Set(all.map(r=>r.w))].sort();
  let range = '';
  if (wks.length){ const s = pd(wks[0]), e = addD(pd(wks[wks.length-1]),4);
    range = ' · ' + MS[s.getMonth()]+' '+s.getDate()+' – '+MS[e.getMonth()]+' '+e.getDate()+', '+e.getFullYear(); }
  $('sub').textContent = 'Source: Proactive Schedule Tracker · ' + new Set(all.map(r=>r.p)).size + ' providers' + range;
  const isCur = st.month === CUR;
  $('curBtn').classList.toggle('cur', isCur);
  $('pastSel').classList.toggle('on', !isCur);
  $('pastSel').value = isCur ? '' : st.month;
}
const LEG = '<span><i style="background:var(--filled)"></i>Filled</span><span><i style="background:var(--avail)"></i>Available</span><span><i style="background:var(--away)"></i>PTO / Traveling</span><span><i style="background:var(--none)"></i>No Schedule</span>';
const LEG_H = '<span><i style="background:var(--h-full)"></i>Fully booked</span><span><i style="background:var(--h-low)"></i>1–2 open</span><span><i style="background:var(--h-mid)"></i>3–4 open</span><span><i style="background:var(--h-high)"></i>5+ open</span><span><i style="background:var(--h-away)"></i>PTO / Holiday / Traveling</span><span><i style="background:var(--h-none)"></i>No schedule</span>';

function dayCell(r,i){
  const d = r.days[i];
  const open = d.s.filter(s=>s==='available').length;
  const allAway = d.s.every(isAway);
  const travel = d.s.some(s=>s==='traveling') && !allAway;
  let loc;
  if (d.split && d.pm) loc = `AM: ${esc(d.am||'—')}<br><span class="pm">PM: ${esc(d.pm)}</span>`;
  else loc = esc(d.am || (allAway ? (d.s.includes('pto')?'PTO':'Traveling') : '—'));
  return `<div class="day"><div class="dname">${dLabel(r.w,i)}</div><div class="slots">${d.s.map((s,j)=>`<div class="s ${s}" title="${SL[j]} · ${s==='noScheduleNoSlot'||s==='blank'?'No schedule':s}">${SL[j]}</div>`).join('')}</div>
    <div class="loc">${loc}</div>${open?`<div class="open">${open} open</div>`:''}${travel?'<div class="tag">✈ Travel</div>':''}</div>`;
}
function renderProv(recs){
  const by = {}; recs.forEach(r => (by[r.p] ||= []).push(r));
  return Object.keys(by).sort().map(p => {
    const rs = by[p].sort((a,b)=>a.w.localeCompare(b.w)); const {a,f} = count(rs);
    return `<section class="card"><div class="card-h"><h2>${esc(p)}</h2><span>${a} open slots · ${f} filled</span></div>
      <div class="scroll">${rs.map(r=>`<div class="wk"><div class="lbl">${wLabel(r.w)}</div>${[0,1,2,3,4].map(i=>dayCell(r,i)).join('')}</div>`).join('')}</div></section>`;
  }).join('');
}
function renderLoc(recs){
  const q = st.q.trim().toLowerCase();
  const by = {};
  const add = (loc,row) => { if(!loc) return; (by[loc] ||= []).push(row); };
  recs.forEach(r => r.days.forEach((d,i) => {
    if (d.s.every(s=>isAway(s)||isNone(s)) && !d.am) return;
    if (d.split && d.pm){
      add(d.am, {r,i,slots:d.s.slice(0,5),half:'AM'});
      add(d.pm, {r,i,slots:d.s.slice(5),half:'PM'});
    } else add(d.am || 'Unassigned', {r,i,slots:d.s,half:''});
  }));
  const locs = Object.keys(by).sort().filter(l => !q || l.toLowerCase().includes(q) || by[l].some(x=>x.r.p.toLowerCase().includes(q)));
  if (!locs.length) return '';
  return locs.map(l => {
    const rows = by[l].sort((x,y)=> x.r.w.localeCompare(y.r.w) || x.i-y.i || x.r.p.localeCompare(y.r.p));
    const tot = rows.reduce((n,x)=>n+x.slots.filter(s=>s==='available').length,0);
    return `<section class="card"><div class="card-h"><h2>${esc(l)}</h2><span>${tot} open slots across ${rows.length} visit${rows.length===1?'':'s'}</span></div>
    <div class="scroll"><table><thead><tr><th>Week</th><th>Day</th><th>Provider</th><th>Slots (8A–5P)</th><th>Available</th><th>Status</th></tr></thead><tbody>
    ${rows.map(x=>{ const o = x.slots.filter(s=>s==='available').length, f = x.slots.filter(s=>s==='filled').length;
      let pill = o ? `<span class="pill o">${o} open</span>` : f ? '<span class="pill f">Full</span>' : x.slots.some(isAway) ? `<span class="pill a">${x.slots.includes('pto')?'PTO':'Traveling'}</span>` : '<span class="pill n">No schedule</span>';
      return `<tr><td>${wLabel(x.r.w)}</td><td>${dLabel(x.r.w,x.i)}</td><td>${esc(x.r.p)}${x.half?` <span class="note">(${x.half})</span>`:''}</td>
      <td><span class="mini">${x.slots.map(s=>`<i class="${s}"></i>`).join('')}</span></td><td class="${o?'num-o':''}">${o}</td><td>${pill}</td></tr>`;}).join('')}
    </tbody></table></div></section>`;
  }).join('');
}
function renderHeat(recs){
  const wks = [...new Set(recs.map(r=>r.w))].sort();
  const provs = [...new Set(recs.map(r=>r.p))].sort();
  if (!wks.length) return '';
  const idx = {}; recs.forEach(r => idx[r.p+'|'+r.w] = r);
  let h = '<div class="hm-wrap"><div class="scroll"><table class="hm"><thead><tr><th class="pn"></th>' +
    wks.map(w=>`<th class="wkh" colspan="5">${wLabel(w)}</th>`).join('') + '</tr><tr><th class="pn">Provider</th>' +
    wks.map(w=>[0,1,2,3,4].map(i=>`<th>${dLabel(w,i).replace(' ','<br>')}</th>`).join('')).join('') + '</tr></thead><tbody>';
  provs.forEach(p => {
    h += `<tr><td class="pn">${esc(p)}</td>`;
    wks.forEach(w => { const r = idx[p+'|'+w];
      for (let i=0;i<5;i++){
        if (!r){ h += '<td><div class="hc na" title="No submission">·</div></td>'; continue; }
        const s = r.days[i].s, o = s.filter(x=>x==='available').length, f = s.filter(x=>x==='filled').length;
        let c, t;
        if (o) { c = o<=2?'low':o<=4?'mid':'high'; t = o; }
        else if (f) { c='full'; t='Full'; }
        else if (s.some(isAway)) { c='away'; t = s.includes('pto') ? 'PTO' : 'Travel'; }
        else { c='none'; t='—'; }
        h += `<td><div class="hc ${c}" title="${esc(p)} · ${dLabel(w,i)} · ${esc(r.days[i].am||'')}">${t}</div></td>`;
      }
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div><p class="note">Cells show open appointment slots. Gray dot = no submission for that week.</p></div>';
}
function render(){
  const recs = filtered();
  header(recs);
  $('legend').innerHTML = st.view==='heat' ? LEG_H : LEG;
  let html = st.view==='prov' ? renderProv(recs) : st.view==='loc' ? renderLoc(recs) : renderHeat(recs);
  if (!html) html = monthRecs().length
    ? '<div class="empty">No schedules match these filters.</div>'
    : `<div class="empty">No tracker submissions for ${esc(mLabel(st.month))} yet. Pick a past month from the dropdown.</div>`;
  $('view').innerHTML = html;
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  st.view = b.dataset.v;
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x===b));
  render();
});
$('curBtn').onclick = () => { st.month = CUR; st.week='all'; setupWeeks(); render(); };
$('pastSel').onchange = e => { if (e.target.value){ st.month = e.target.value; st.week='all'; setupWeeks(); render(); } };
$('weekSel').onchange = e => { st.week = e.target.value; render(); };
$('provSel').onchange = e => { st.prov = e.target.value; render(); };
$('q').oninput = e => { st.q = e.target.value; render(); };
setupMonths(); setupWeeks(); render();
</script>
